# Tests of the built site: `make test` (test/email_templates.py, test/overflow.py).
# The site itself is built and published by GitHub Pages from the master
# branch, independently of this workflow, so a failing test here does not
# stop the pages from being rendered.
name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the older run
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Google Chrome is preinstalled on GitHub's ubuntu-latest runners
      - run: make test
